<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - POP THE LOOK</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f8f8f8;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background:white;padding:30px;border-radius:15px;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.1);text-align:center}
.logo{font-weight:900;letter-spacing:2px;font-size:18px}.sub{color:#888;font-size:11px;margin:5px 0 20px;letter-spacing:1px}
input{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:14px}
button{width:100%;padding:14px;background:black;color:white;border:none;border-radius:8px;margin-top:15px;font-weight:bold;cursor:pointer}
#msg{margin-top:15px;font-size:13px;display:none;padding:12px;border-radius:8px}
.success{background:#e8f5e9;color:#2e7d32}.error{background:#ffebee;color:#c62828}
.back{color:#888;font-size:13px;text-decoration:none;display:block;text-align:left;margin-bottom:10px}
.link{margin-top:18px;font-size:13px;color:#666}.link a{color:black;font-weight:bold;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<a class="back" href="index.html">← Back</a>
<div class="logo" style="display:flex; justify-content:center; margin-bottom:10px;"><img src="logo.png" alt="POP THE LOOK" style="height:70px; width:auto;"></div><p class="sub">WELCOME BACK</p>
<div id="verified" style="display:none;background:#e8f5e9;color:#2e7d32;padding:12px;border-radius:8px;margin-bottom:15px;font-size:13px">✅ Email confirmed! Now sign in.</div>
<input id="email" type="email" placeholder="Email address">
<div style="position:relative; margin:8px 0">
  <input id="pass" type="password" placeholder="Password" style="margin:0; padding-right:45px;">
  <span onclick="toggleEye(this)" style="position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:18px; user-select:none;">👁️</span>
</div>
<button id="btn">SIGN IN</button>
<div id="msg"></div>
<div class="link">New here? <a href="signup.html">Create account</a></div>
</div>
<script>
function toggleEye(el){
  const input = el.previousElementSibling;
  if(input.type === 'password'){ input.type='text'; el.textContent='🙈'; }
  else { input.type='password'; el.textContent='👁️'; }
}
const supabaseClient = supabase.createClient("https://pslsuittihsaeeyrihgr.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzbHN1aXR0aWhzYWVleXJpaGdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NDE4MjYsImV4cCI6MjEwNTQxNzgyNn0.dZEAEHzbOgaPHzQWWzk1whjPFmmME8G2kuvAc4b72mI");
if(window.location.hash.includes('access_token')||window.location.search.includes('verified')){document.getElementById('verified').style.display='block';}
document.getElementById('btn').onclick=async()=>{
 const email=document.getElementById('email').value.trim();const pass=document.getElementById('pass').value;
 const btn=document.getElementById('btn');const msg=document.getElementById('msg');
 if(!email||!pass){alert('Fill all');return;}
 btn.innerText='Signing in...';btn.disabled=true;
 const{error}=await supabaseClient.auth.signInWithPassword({email,password:pass});
 msg.style.display='block';
 if(error){msg.className='error';msg.innerText='❌ '+error.message;btn.innerText='SIGN IN';btn.disabled=false;}
 else{msg.className='success';msg.innerText='✅ Success!';setTimeout(()=>location.href='index.html',1000);}
}
</script>
</body>
</html>
