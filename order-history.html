<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:white}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #e5e5e5;position:sticky;top:0;background:white;z-index:10}
header a{text-decoration:none;color:black;font-weight:800;font-size:14px}
.logo{height:40px}
.container{max-width:800px;margin:0 auto;padding:20px}
h1{font-size:24px;font-weight:900;margin-bottom:6px}
.sub{color:#777;font-size:13px;margin-bottom:20px}
.order-card{border:1.5px solid #eee;border-radius:16px;padding:16px;margin-bottom:14px;background:white}
.order-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.order-id{font-weight:900;font-size:14px}
.order-date{font-size:12px;color:#888}
.status{display:inline-block;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:800}
.s-pending{background:#fff3cd;color:#856404}
.s-shipped{background:#cce5ff;color:#004085}
.s-delivered{background:#d4edda;color:#155724}
.items{font-size:13px;color:#333;margin:10px 0}
.track-btn{background:black;color:white;border:none;padding:10px 16px;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;margin-top:8px}
.track-box{margin-top:12px;display:none;border-top:1px dashed #eee;padding-top:12px}
.track-step{display:flex;gap:10px;margin-bottom:10px}
.dot{width:10px;height:10px;border-radius:50%;background:#ddd;margin-top:4px}
.dot.active{background:black}
.step-text{font-size:13px}
.empty{text-align:center;padding:60px 20px;color:#888}
</style>
</head>
<body>
<header>
<a href="index.html" data-i18n="back">← Back</a>
<img src="logo.png" class="logo">
<a href="shop.html" data-i18n="shop">Shop</a>
</header>

<div class="container">
<h1 data-i18n="myOrders">My Orders</h1>
<p class="sub" data-i18n="myOrdersDesc">View and track your old and new orders</p>
<div id="ordersList"></div>
</div>

<script>
const supabaseClient=supabase.createClient("https://pslsuittihsaeeyrihgr.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzbHN1aXR0aWhzYWVleXJpaGdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NDE4MjYsImV4cCI6MjEwNTQxNzgyNn0.dZEAEHzbOgaPHzQWWzk1whjPFmmME8G2kuvAc4b72mI");

// DEMO ORDERS - later we will connect to Supabase orders table
function getOrders(){
  const localOrders = JSON.parse(localStorage.getItem('orders')||'[]');
  if(localOrders.length>0) return localOrders;
  // demo if empty
  return [
    {id:"PTL-10234", date:"2026-05-10", status:"shipped", total:"£89.00", items:"Hoodie x1, Cargo x1"},
    {id:"PTL-10021", date:"2026-03-22", status:"delivered", total:"£45.00", items:"Tee x2"},
    {id:"PTL-09812", date:"2026-02-05", status:"delivered", total:"£120.00", items:"Dress x1"}
  ];
}

function render(){
  const lang = localStorage.getItem('lang')||'en';
  const t = translations[lang]||translations.en;
  const orders = getOrders();
  const list = document.getElementById('ordersList');
  if(orders.length===0){
    list.innerHTML = `<div class="empty">${t.noOrders}<br><a href="shop.html">${t.shop}</a></div>`;
    return;
  }
  list.innerHTML = orders.map(o=>`
    <div class="order-card">
      <div class="order-top">
        <div>
          <div class="order-id">${o.id}</div>
          <div class="order-date">${o.date} • ${o.total}</div>
        </div>
        <span class="status s-${o.status}">${t[o.status]||o.status.toUpperCase()}</span>
      </div>
      <div class="items">${o.items}</div>
      <button class="track-btn" onclick="toggleTrack('${o.id}')" data-i18n="trackOrder">${t.trackOrder}</button>
      <div class="track-box" id="track-${o.id}">
        <div class="track-step"><div class="dot active"></div><div class="step-text"><b data-i18n="orderPlaced">${t.orderPlaced}</b><br>${o.date}</div></div>
        <div class="track-step"><div class="dot ${o.status!='pending'?'active':''}"></div><div class="step-text"><b data-i18n="shipped">${t.shipped}</b><br><span data-i18n="onTheWay">${t.onTheWay}</span></div></div>
        <div class="track-step"><div class="dot ${o.status=='delivered'?'active':''}"></div><div class="step-text"><b data-i18n="delivered">${t.delivered}</b><br>${o.status=='delivered'?t.deliveredDone:t.pendingText}</div></div>
      </div>
    </div>
  `).join('');
}

function toggleTrack(id){
  const el=document.getElementById('track-'+id);
  el.style.display = el.style.display==='block'?'none':'block';
}

  fr: { back:"← Retour", shop:"Boutique", myOrders:"Mes commandes", myOrdersDesc:"Voir et suivre vos anciennes et nouvelles commandes", trackOrder:"Suivre la commande", orderPlaced:"Commande passée", shipped:"Expédiée", delivered:"Livrée", onTheWay:"En route", deliveredDone:"Livrée", pendingText:"En attente", noOrders:"Pas encore de commandes.", pending:"EN ATTENTE", shipped:"EXPÉDIÉE", delivered:"LIVRÉE" },
  es: { back:"← Atrás", shop:"Tienda", myOrders:"Mis pedidos", myOrdersDesc:"Ver y seguir tus pedidos antiguos y nuevos", trackOrder:"Seguir pedido", orderPlaced:"Pedido realizado", shipped:"Enviado", delivered:"Entregado", onTheWay:"En camino", deliveredDone:"Entregado", pendingText:"Pendiente", noOrders:"Aún no hay pedidos.", pending:"PENDIENTE", shipped:"ENVIADO", delivered:"ENTREGADO" },
  it: { back:"← Indietro", shop:"Negozio", myOrders:"I miei ordini", myOrdersDesc:"Visualizza e traccia i tuoi ordini vecchi e nuovi", trackOrder:"Traccia ordine", orderPlaced:"Ordine effettuato", shipped:"Spedito", delivered:"Consegnato", onTheWay:"In arrivo", deliveredDone:"Consegnato", pendingText:"In attesa", noOrders:"Ancora nessun ordine.", pending:"IN ATTESA", shipped:"SPEDITO", delivered:"CONSEGNATO" },

  pl: { back:"← Wróć", shop:"Sklep", myOrders:"Moje zamówienia", myOrdersDesc:"Zobacz i śledź stare i nowe zamówienia", trackOrder:"Śledź zamówienie", orderPlaced:"Zamówienie złożone", shipped:"Wysłane", delivered:"Dostarczone", onTheWay:"W drodze", deliveredDone:"Dostarczone", pendingText:"Oczekujące", noOrders:"Brak zamówień.", pending:"OCZEKUJĄCE", shipped:"WYSŁANE", delivered:"DOSTARCZONE" },
  pt: { back:"← Voltar", shop:"Loja", myOrders:"Meus pedidos", myOrdersDesc:"Ver e rastrear seus pedidos antigos e novos", trackOrder:"Rastrear pedido", orderPlaced:"Pedido feito", shipped:"Enviado", delivered:"Entregue", onTheWay:"A caminho", deliveredDone:"Entregue", pendingText:"Pendente", noOrders:"Ainda não há pedidos.", pending:"PENDENTE", shipped:"ENVIADO", delivered:"ENTREGUE" },

  zh: { back:"← 返回", shop:"商店", myOrders:"我的订单", myOrdersDesc:"查看和跟踪您的新旧订单", trackOrder:"跟踪订单", orderPlaced:"已下单", shipped:"已发货", delivered:"已送达", onTheWay:"运输中", deliveredDone:"已送达", pendingText:"待处理", noOrders:"还没有订单。", pending:"待处理", shipped:"已发货", delivered:"已送达" }

function applyLanguage(lang){
  const t = translations[lang] || translations.en;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(t[key]) el.textContent=t[key];
  });
  localStorage.setItem('lang', lang);
  document.documentElement.lang=lang;
  render();
}

const savedLang=localStorage.getItem('lang')||'en';
applyLanguage(savedLang);
</script>
</body>
</html>
