body{background:#fafafa}

<!-- EMAIL SECTION -->
<div class="card">
<h2 data-i18n="changeEmail">Change Email</h2>

<label data-i18n="currentEmail">Current Email</label>
<div class="input-wrap"><input id="currentEmail" type="email" disabled style="background:#f5f5f5"></div>

<label data-i18n="newEmail">New Email</label>
<div class="input-wrap"><input id="newEmail" type="email" placeholder="new@email.com"></div>

<label data-i18n="confirmNewEmail">Confirm New Email</label>
<div class="input-wrap"><input id="confirmEmail" type="email" placeholder="confirm new email"></div>

<button class="save" onclick="changeEmail()" data-i18n="sendConfirm">SEND CONFIRMATION EMAIL</button>
<div id="emailSuccess" class="success"></div>
<div id="emailError" class="error"></div>
<p class="note" data-i18n="emailNote">We will send a confirmation to your new email. Click inside email to verify, then signin page will open.</p>
</div>

<!-- PASSWORD SECTION -->
<div class="card">
<h2 data-i18n="changePass">Change Password</h2>

<label data-i18n="currentPass">Current Password</label>
<div class="input-wrap">
<input id="currentPass" type="password" placeholder="••••••••">
<button class="eye" type="button" onclick="toggleEye('currentPass', this)">👁️</button>
</div>

<label data-i18n="newPass">New Password</label>
<div class="input-wrap">
<input id="newPass" type="password" placeholder="new password">
<button class="eye" type="button" onclick="toggleEye('newPass', this)">👁️</button>
</div>

<label data-i18n="confirmNewPass">Confirm New Password</label>
<div class="input-wrap">
<input id="confirmPass" type="password" placeholder="confirm new password">
<button class="eye" type="button" onclick="toggleEye('confirmPass', this)">👁️</button>
</div>

<button class="save" onclick="changePassword()" data-i18n="updatePass">UPDATE PASSWORD</button>
<div id="passSuccess" class="success"></div>
<div id="passError" class="error"></div>
</div>

</div>

async function loadUser(){
  const {data} = await supabaseClient.auth.getSession();
  if(data.session){
    document.getElementById('currentEmail').value = data.session.user.email;
  } else {
    location.href='signin.html';
  }
}
loadUser();

function toggleEye(id, btn){
  const input = document.getElementById(id);
  if(input.type==='password'){
    input.type='text';
    btn.textContent='🙈';
  } else {
    input.type='password';
    btn.textContent='👁️';
  }
}

async function changeEmail(){
  const t = translations[localStorage.getItem('lang')||'en']||translations.en;
  const newEmail = document.getElementById('newEmail').value.trim();
  const confirmEmail = document.getElementById('confirmEmail').value.trim();
  const err = document.getElementById('emailError');
  const succ = document.getElementById('emailSuccess');
  err.style.display='none'; succ.style.display='none';
  if(!newEmail ||!confirmEmail){ err.textContent=t.fillBoth; err.style.display='block'; return; }
  if(newEmail!==confirmEmail){ err.textContent=t.emailsNoMatch; err.style.display='block'; return; }
  const {error} = await supabaseClient.auth.updateUser({ email: newEmail }, { emailRedirectTo: window.location.origin + '/signin.html' });
  if(error){ err.textContent=error.message; err.style.display='block'; }
  else { succ.textContent=t.emailSent; succ.style.display='block'; }
}

async function changePassword(){
  const t = translations[localStorage.getItem('lang')||'en']||translations.en;
  const currentPass = document.getElementById('currentPass').value;
  const newPass = document.getElementById('newPass').value;
  const confirmPass = document.getElementById('confirmPass').value;
  const err = document.getElementById('passError');
  const succ = document.getElementById('passSuccess');
  err.style.display='none'; succ.style.display='none';
  if(!currentPass ||!newPass ||!confirmPass){ err.textContent=t.fillAllPass; err.style.display='block'; return; }
  if(newPass!==confirmPass){ err.textContent=t.passNoMatch; err.style.display='block'; return; }
  if(newPass.length < 6){ err.textContent=t.pass6Char; err.style.display='block'; return; }
  try{
    const {data: sessionData} = await supabaseClient.auth.getSession();
    const email = sessionData.session.user.email;
    const {error: signInError} = await supabaseClient.auth.signInWithPassword({ email, password: currentPass });
    if(signInError){ err.textContent=t.currentPassWrong; err.style.display='block'; return; }
    const {error} = await supabaseClient.auth.updateUser({ password: newPass });
    if(error){ err.textContent=error.message; err.style.display='block'; }
    else { succ.textContent=t.passUpdated; succ.style.display='block'; document.getElementById('currentPass').value=''; document.getElementById('newPass').value=''; document.getElementById('confirmPass').value=''; }
  } catch(e){ err.textContent=e.message; err.style.display='block'; }
}

function applyLanguage(lang){
  const t = translations[lang] || translations.en;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(t[key]) el.textContent=t[key];
  });
  document.documentElement.lang=lang;
}
const savedLang=localStorage.getItem('lang')||'en';
