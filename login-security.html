<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#fafafa}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #e5e5e5;background:white;position:sticky;top:0;z-index:10}
header a{text-decoration:none;color:black;font-weight:800;font-size:14px}
.logo{height:40px}
.container{max-width:520px;margin:0 auto;padding:22px 16px}
h1{font-size:22px;font-weight:900;margin-bottom:18px}
.card{background:white;border:1.5px solid #eee;border-radius:20px;padding:22px;margin-bottom:18px}
.card h2{font-size:16px;font-weight:900;margin-bottom:16px}
label{font-size:10px;font-weight:800;color:#888;text-transform:uppercase;letter-spacing:.6px;display:block;margin:14px 0 6px}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap input{width:100%;padding:14px 44px 14px 14px;border:1.8px solid #e5e5e5;border-radius:13px;font-size:14px;outline:none;background:white}
.input-wrap input:focus{border-color:black;background:#fafafa}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);cursor:pointer;background:#f2f2f2;border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.save{width:100%;margin-top:18px;background:black;color:white;border:none;padding:14px;border-radius:13px;font-weight:900;font-size:13px;cursor:pointer}
.note{font-size:11px;color:#888;margin-top:10px;line-height:1.4;background:#f9f9f9;padding:10px 12px;border-radius:10px}
.success{color:#0a7a2e;font-size:13px;margin-top:12px;display:none;background:#e6f9ec;padding:10px;border-radius:10px;font-weight:700}
.error{color:#c00;font-size:13px;margin-top:12px;display:none;background:#ffe6e6;padding:10px;border-radius:10px;font-weight:700}
</style>
</head>
<body>
<header>
<a href="index.html" data-i18n="back">← Back</a>
<img src="logo.png" class="logo">
<a href="shop.html" data-i18n="shop">Shop</a>
</header>
<div class="container">
<h1 data-i18n="loginSec">Login & Security</h1>
<div class="card">
<h2 data-i18n="changeEmail">Change Email</h2>
<label data-i18n="currentEmail">Current Email</label>
<div class="input-wrap"><input id="currentEmail" type="email" disabled style="background:#f5f5f5"></div>
<label data-i18n="newEmail">New Email</label>
<div class="input-wrap"><input id="newEmail" type="email" placeholder="new@email.com"></div>
<label data-i18n="confirmNewEmail">Confirm New Email</label>
<div class="input-wrap"><input id="confirmEmail" type="email" placeholder="confirm new email"></div>
<button class="save" id="emailBtn" onclick="changeEmail()" data-i18n="sendConfirm">SEND CONFIRMATION EMAIL</button>
<div id="emailSuccess" class="success"></div>
<div id="emailError" class="error"></div>
<p class="note" data-i18n="emailNote">We will send a confirmation to your new email. Click inside email to verify, then signin page will open.</p>
</div>
<div class="card">
<h2 data-i18n="changePass">Change Password</h2>
<label data-i18n="currentPass">Current Password</label>
<div class="input-wrap"><input id="currentPass" type="password" placeholder="••••••••"><button class="eye" type="button" onclick="toggleEye('currentPass', this)">👁️</button></div>
<label data-i18n="newPass">New Password</label>
<div class="input-wrap"><input id="newPass" type="password" placeholder="new password"><button class="eye" type="button" onclick="toggleEye('newPass', this)">👁️</button></div>
<label data-i18n="confirmNewPass">Confirm New Password</label>
<div class="input-wrap"><input id="confirmPass" type="password" placeholder="confirm new password"><button class="eye" type="button" onclick="toggleEye('confirmPass', this)">👁️</button></div>
<button class="save" onclick="changePassword()" data-i18n="updatePass">UPDATE PASSWORD</button>
<div id="passSuccess" class="success"></div>
<div id="passError" class="error"></div>
</div>
</div>
<script>
const supabaseClient=supabase.createClient("https://pslsuittihsaeeyrihgr.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzbHN1aXR0aWhzYWVleXJpaGdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NDE4MjYsImV4cCI6MjEwNTQxNzgyNn0.dZEAEHzbOgaPHzQWWzk1whjPFmmME8G2kuvAc4b72mI", { auth: { persistSession: true, autoRefreshToken: true } });

async function loadUser(){
  const {data:{session}} = await supabaseClient.auth.getSession();
  if(!session){ location.href='signin.html'; return; }
  document.getElementById('currentEmail').value = session.user.email;
}
loadUser();

function toggleEye(id, btn){
  const input = document.getElementById(id);
  if(input.type==='password'){ input.type='text'; btn.textContent='🙈'; }
  else { input.type='password'; btn.textContent='👁️'; }
}

async function changeEmail(){
  const lang = localStorage.getItem('lang')||'en';
  const t = translations[lang]||translations.en;
  const newEmail = document.getElementById('newEmail').value.trim();
  const confirmEmail = document.getElementById('confirmEmail').value.trim();
  const err = document.getElementById('emailError');
  const succ = document.getElementById('emailSuccess');
  const btn = document.getElementById('emailBtn');
  err.style.display='none'; succ.style.display='none';
  if(!newEmail ||!confirmEmail){ err.textContent=t.fillBoth; err.style.display='block'; return; }
  if(newEmail!==confirmEmail){ err.textContent=t.emailsNoMatch; err.style.display='block'; return; }

  btn.textContent="SENDING..."; btn.disabled=true;

  try{
    // THIS FIXES BEARER TOKEN ERROR - refresh first
    await supabaseClient.auth.refreshSession();
    const {data:{session}, error: sessErr} = await supabaseClient.auth.getSession();
    if(sessErr ||!session){ throw new Error("Session expired. Please sign in again."); }

    // CORRECT V2 syntax - ONLY ONE object, no second param【1186510152219298174†L128-L132】
    const {data, error} = await supabaseClient.auth.updateUser({
      email: newEmail
    });

    if(error) throw error;
    succ.textContent=t.emailSent; succ.style.display='block';
  }catch(e){
    if(e.message.includes("Bearer") || e.message.includes("session") || e.message.includes("token")){
      err.textContent="Session expired. Please go to Sign In page and login again, then try.";
    } else {
      err.textContent=e.message;
    }
    err.style.display='block';
  } finally {
    btn.textContent=t.sendConfirm; btn.disabled=false;
  }
}

async function changePassword(){
  const lang = localStorage.getItem('lang')||'en';
  const t = translations[lang]||translations.en;
  const currentPass = document.getElementById('currentPass').value;
  const newPass = document.getElementById('newPass').value;
  const confirmPass = document.getElementById('confirmPass').value;
  const err = document.getElementById('passError');
  const succ = document.getElementById('passSuccess');
  err.style.display='none'; succ.style.display='none';
  if(!currentPass ||!newPass ||!confirmPass){ err.textContent=t.fillAllPass; err.style.display='block'; return; }
  if(newPass!==confirmPass){ err.textContent=t.passNoMatch; err.style.display='block'; return; }
  if(newPass.length<6){ err.textContent=t.pass6Char; err.style.display='block'; return; }
  try{
    await supabaseClient.auth.refreshSession();
    const {data:{session}} = await supabaseClient.auth.getSession();
    if(!session) throw new Error("Session expired");
    const email = session.user.email;
    const {error: signInError} = await supabaseClient.auth.signInWithPassword({ email, password: currentPass });
    if(signInError){ err.textContent=t.currentPassWrong; err.style.display='block'; return; }
    const {error} = await supabaseClient.auth.updateUser({ password: newPass });
    if(error) throw error;
    succ.textContent=t.passUpdated; succ.style.display='block';
    document.getElementById('currentPass').value=''; document.getElementById('newPass').value=''; document.getElementById('confirmPass').value='';
  }catch(e){ err.textContent=e.message; err.style.display='block'; }
}

function applyLanguage(lang){
  const t = translations[lang] || translations.en;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(t[key]) el.textContent=t[key];
  });
  document.documentElement.lang=lang;
}
applyLanguage(localStorage.getItem('lang')||'en');
</script>
