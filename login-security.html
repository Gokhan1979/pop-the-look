<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#fafafa}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #e5e5e5;background:white;position:sticky;top:0;z-index:10}
header a{text-decoration:none;color:black;font-weight:800;font-size:14px}
.logo{height:40px}
.container{max-width:520px;margin:0 auto;padding:22px 16px}
h1{font-size:22px;font-weight:900;margin-bottom:18px}
.card{background:white;border:1.5px solid #eee;border-radius:20px;padding:22px;margin-bottom:18px}
.card h2{font-size:16px;font-weight:900;margin-bottom:16px}
label{font-size:10px;font-weight:800;color:#888;text-transform:uppercase;letter-spacing:.6px;display:block;margin:14px 0 6px}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap input{width:100%;padding:14px 44px 14px 14px;border:1.8px solid #e5e5e5;border-radius:13px;font-size:14px;outline:none;background:white}
.save{width:100%;margin-top:18px;background:black;color:white;border:none;padding:14px;border-radius:13px;font-weight:900;font-size:13px;cursor:pointer}
.note{font-size:11px;color:#888;margin-top:10px;line-height:1.4;background:#f9f9f9;padding:10px 12px;border-radius:10px}
.success{color:#0a7a2e;font-size:13px;margin-top:12px;display:none;background:#e6f9ec;padding:10px;border-radius:10px;font-weight:700}
.error{color:#c00;font-size:13px;margin-top:12px;display:none;background:#ffe6e6;padding:10px;border-radius:10px;font-weight:700;word-break:break-word}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);cursor:pointer;background:#f2f2f2;border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
</style>

<body>
<header>
<a href="index.html" data-i18n="back">← Back</a>
<img src="logo.png" class="logo">
<a href="shop.html" data-i18n="shop">Shop</a>
</header>
<div class="container">
<h1 data-i18n="title">Login & Security</h1>

<div class="card">
<h2 data-i18n="changeEmail">Change Email</h2>
<label data-i18n="currentEmail">Current Email</label>
<div class="input-wrap"><input id="currentEmail" type="email" disabled style="background:#f5f5f5" autocomplete="off"></div>

<label data-i18n="currentPassConfirm">Current Password (to confirm it's you)</label>
<div class="input-wrap">
<input id="currentPassForEmail" type="password" data-i18n-placeholder="enterCurrentPassPh" placeholder="enter current password" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')">
<button class="eye" type="button" onclick="toggleEye('currentPassForEmail', this)">👁️</button>
</div>

<label data-i18n="newEmail">New Email</label>
<div class="input-wrap"><input id="newEmail" type="email" data-i18n-placeholder="newEmailPh" placeholder="new@email.com" autocomplete="off"></div>

<label data-i18n="confirmNewEmail">Confirm New Email</label>
<div class="input-wrap"><input id="confirmEmail" type="email" data-i18n-placeholder="confirmNewEmailPh" placeholder="confirm new email" autocomplete="off"></div>

<button class="save" id="emailBtn" onclick="changeEmail()" data-i18n="sendConfirm">SEND CONFIRMATION EMAIL</button>
<div id="emailSuccess" class="success"></div>
<div id="emailError" class="error"></div>
<p class="note" data-i18n="emailNote">We will send a confirmation to your NEW email. Check spam too. Only after clicking link, email changes.</p>
</div>

<div class="card">
<h2 data-i18n="changePass">Change Password</h2>

<label data-i18n="currentPass">Current Password</label>
<div class="input-wrap">
<input id="currentPassForPassword" type="password" data-i18n-placeholder="currentPassPh" placeholder="current password" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')">
<button class="eye" type="button" onclick="toggleEye('currentPassForPassword', this)">👁️</button>
</div>

<label data-i18n="newPass">New Password</label>
<div class="input-wrap">
<input id="newPassword" type="password" data-i18n-placeholder="newPassPh" placeholder="new password" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')">
<button class="eye" type="button" onclick="toggleEye('newPassword', this)">👁️</button>
</div>

<label data-i18n="confirmNewPass">Confirm New Password</label>
<div class="input-wrap">
<input id="confirmPassword" type="password" data-i18n-placeholder="confirmNewPassPh" placeholder="confirm new password" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')">
<button class="eye" type="button" onclick="toggleEye('confirmPassword', this)">👁️</button>
</div>

<button class="save" id="passBtn" onclick="changePassword()" data-i18n="changePassBtn">CHANGE PASSWORD</button>
<div id="passSuccess" class="success"></div>
<div id="passError" class="error"></div>
</div>

</div>

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzbHN1aXR0aWhzYWVleXJpaGdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NDE4MjYsImV4cCI6MjEwNTQxNzgyNn0.dZEAEHzbOgaPHzQWWzk1whjPFmmME8G2kuvAc4b72mI";
const supabaseClient=supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage } });

async function loadUser(){
  const {data:{session}} = await supabaseClient.auth.getSession();
  if(!session){
    const errEl=document.getElementById('emailError');
    const lang=localStorage.getItem('lang')||'en';
    errEl.textContent=(translations[lang]||translations.en).noSession;
    errEl.style.display='block';
    return;
  }
  document.getElementById('currentEmail').value = session.user.email;
}
loadUser();

function toggleEye(id, btn){
  const input = document.getElementById(id);
  input.type = input.type==='password'? 'text' : 'password';
  btn.textContent = input.type==='password'? '👁️' : '🙈';
}

async function changeEmail(){
  const newEmail = document.getElementById('newEmail').value.trim();
  const confirmEmail = document.getElementById('confirmEmail').value.trim();
  const currentPassword = document.getElementById('currentPassForEmail').value;
  const err = document.getElementById('emailError');
  const succ = document.getElementById('emailSuccess');
  const btn = document.getElementById('emailBtn');
  const lang=localStorage.getItem('lang')||'en';
  const t=translations[lang]||translations.en;
  err.style.display='none'; succ.style.display='none';
  if(!currentPassword){ err.textContent=t.enterCurrentPassErr; err.style.display='block'; return; }
  if(!newEmail || newEmail!==confirmEmail){ err.textContent=t.emailsNoMatch; err.style.display='block'; return; }
  btn.textContent=t.sending; btn.disabled=true;
  try{
    const {data:{session: oldSession}} = await supabaseClient.auth.getSession();
    const currentEmail = oldSession?.user?.email || document.getElementById('currentEmail').value;
    const {error: signInErr} = await supabaseClient.auth.signInWithPassword({ email: currentEmail, password: currentPassword });
    if(signInErr) throw new Error(t.wrongPass);
    const {error} = await supabaseClient.auth.updateUser({ email: newEmail });
    if(error) throw error;
    succ.textContent="✅ "+t.confirmSentTo+" " + newEmail + "! "+t.checkSpam;
    succ.style.display='block';
  }catch(e){ err.textContent=e.message; err.style.display='block'; }
  finally { btn.textContent=t.sendConfirm; btn.disabled=false; }
}

async function changePassword(){
  const currentPass = document.getElementById('currentPassForPassword').value;
  const newPass = document.getElementById('newPassword').value;
  const confirmPass = document.getElementById('confirmPassword').value;
  const err = document.getElementById('passError');
  const succ = document.getElementById('passSuccess');
  const btn = document.getElementById('passBtn');
  const lang=localStorage.getItem('lang')||'en';
  const t=translations[lang]||translations.en;
  err.style.display='none'; succ.style.display='none';
  if(!currentPass){ err.textContent=t.enterCurrentPassErr; err.style.display='block'; return; }
  if(newPass.length < 6){ err.textContent=t.passMin; err.style.display='block'; return; }
  if(newPass!== confirmPass){ err.textContent=t.passNoMatch; err.style.display='block'; return; }
  btn.textContent=t.updating; btn.disabled=true;
  try{
    const {data:{session}} = await supabaseClient.auth.getSession();
    const currentEmail = session.user.email;
    const {error: signInErr} = await supabaseClient.auth.signInWithPassword({ email: currentEmail, password: currentPass });
    if(signInErr) throw new Error(t.wrongPass);
    const {error} = await supabaseClient.auth.updateUser({ password: newPass });
    if(error) throw error;
    succ.textContent="✅ "+t.passChanged;
    succ.style.display='block';
    document.getElementById('currentPassForPassword').value='';
    document.getElementById('newPassword').value='';
    document.getElementById('confirmPassword').value='';
  }catch(e){ err.textContent=e.message; err.style.display='block'; }
  finally{ btn.textContent=t.changePassBtn; btn.disabled=false; }
}

function applyLang(){
  const lang=localStorage.getItem('lang')||'en';
  const t=translations[lang]||translations.en;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n');
    if(t[k]) el.textContent=t[k];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    const k=el.getAttribute('data-i18n-placeholder');
    if(t[k]) el.placeholder=t[k];
  });
}
