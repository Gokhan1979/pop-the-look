.sub{font-size:13px;color:#666;margin-bottom:18px}
.order-card{background:#fff;border:1.5px solid #e5e5e5;border-radius:16px;padding:16px;margin-bottom:16px}
.order-head{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#888;margin-bottom:12px;text-transform:uppercase}
.item-row{display:flex;gap:12px;padding:12px 0;border-top:1px solid #f0f0f0}
.item-img{width:70px;height:90px;background:#eee;border-radius:10px;object-fit:cover}
.item-info{flex:1}
.item-name{font-size:13px;font-weight:700;line-height:1.3}
.item-meta{font-size:11px;color:#888;margin:4px 0}
.item-price{font-size:13px;font-weight:800;margin-top:4px}
.action-row{display:flex;gap:10px;margin-top:10px}
.btn{flex:1;padding:10px;border-radius:10px;border:1.5px solid #000;font-weight:900;font-size:12px;cursor:pointer;text-transform:uppercase}
.btn-keep{background:#000;color:#fff}
.btn-return{background:#fff;color:#000}
.btn-return.active{background:#000;color:#fff}
.btn-keep.active{background:#fff;color:#000;border-color:#ccc;opacity:0.6}
.reason-box{margin-top:10px;display:none}
.reason-box select{width:100%;padding:10px;border:1.5px solid #e5e5e5;border-radius:10px;font-size:12px}
.return-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e5e5;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.return-bar button{background:#0f7a2a;color:#fff;border:none;padding:14px 22px;border-radius:10px;font-weight:900;font-size:13px;cursor:pointer}
.empty{background:#fff;border:1.5px dashed #ddd;border-radius:16px;padding:30px;text-align:center;color:#888}
</style>
</head>
<body>

<div class="logo">POP THE LOOK</div>
<button class="back" onclick="location.href='index.html'">← Back</button>
</div>

<div class="wrap">
<h1 data-i18n="title">Return an Item</h1>
<div class="sub" data-i18n="sub">Select items you want to return from your received orders. You have 28 days to return.</div>

<div id="ordersList"></div>
</div>

<div class="return-bar" id="returnBar" style="display:none">
<div><b id="count">0</b> <span data-i18n="itemsToReturn">items to return</span></div>
<button onclick="submitReturn()" data-i18n="confirm">CONFIRM RETURN</button>
</div>

<script>
const supabaseClient = supabase.createClient("https://pslsuittihsaeeyrihgr.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzbHN1aXR0aWhzYWVleXJpaGdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NDE4MjYsImV4cCI6MjEwNTQxNzgyNn0.dZEAEHzbOgaPHzQWWzk1whjPFmmME8G2kuvAc4b72mI");

// DEMO DATA - if no orders, show example. In real app, replace with Supabase fetch

  let orders = JSON.parse(localStorage.getItem('orders')||'null');
  if(!orders){
    orders = [
      {
        id:'ORD-88231',
        date:'2026-09-18',
        status:'delivered',
        items:[
          {id:'1', name:'Oversized Cotton T-Shirt - Black', size:'M', price:'£18.99', img:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=200'},
          {id:'2', name:'Wide Leg Cargo Trousers', size:'S', price:'£32.50', img:'https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=200'}
        ]
      },
      {
        id:'ORD-87912',
        date:'2026-09-10',
        status:'delivered',
        items:[
          {id:'3', name:'Knitted Sweater - Cream', size:'L', price:'£29.99', img:'https://images.unsplash.com/photo-1434389677669-e08b4cac3105?w=200'}
        ]
      }
    ];
  }
  return orders.filter(o=>o.status==='delivered' || o.status==='received' || o.status==='completed');
}

let toReturn = {}; // itemId -> reason

const translations={
en:{title:"Return an Item",sub:"Select items you want to return from your received orders. You have 28 days to return.",keep:"KEEP",ret:"RETURN",confirm:"CONFIRM RETURN",itemsToReturn:"items to return",delivered:"Delivered",size:"Size",noOrders:"No delivered orders to return.<br><br>Orders marked as Delivered will appear here.",selectReason:"Select reason",tooBig:"Too big",tooSmall:"Too small",style:"Did not like style",desc:"Not as described",damaged:"Damaged",mind:"Changed mind"},
tr:{title:"Ürün İade Et",sub:"Teslim alınan siparişlerinizden iade etmek istediklerinizi seçin. 28 gün iade süreniz var.",keep:"TUT",ret:"İADE ET",confirm:"İADEYİ ONAYLA",itemsToReturn:"ürün iade edilecek",delivered:"Teslim Edildi",size:"Beden",noOrders:"İade edilecek teslim edilmiş sipariş yok.<br><br>Teslim Edildi olarak işaretlenen siparişler burada görünecek.",selectReason:"Sebep seçin",tooBig:"Çok büyük",tooSmall:"Çok küçük",style:"Stili beğenmedim",desc:"Açıklamadaki gibi değil",damaged:"Hasarlı",mind:"Vazgeçtim"},
de:{title:"Artikel zurücksenden",sub:"Wählen Sie Artikel aus gelieferten Bestellungen. 28 Tage Rückgabe.",keep:"BEHALTEN",ret:"ZURÜCKSENDEN",confirm:"RÜCKSENDUNG BESTÄTIGEN",itemsToReturn:"Artikel zum Zurücksenden",delivered:"Geliefert",size:"Größe",noOrders:"Keine gelieferten Bestellungen.",selectReason:"Grund wählen",tooBig:"Zu groß",tooSmall:"Zu klein",style:"Gefällt nicht",desc:"Nicht wie beschrieben",damaged:"Beschädigt",mind:"Meinung geändert"},
fr:{title:"Artikel zurücksenden",sub:"Sélectionnez les articles à retourner. Vous avez 28 jours.",keep:"GARDER",ret:"RETOURNER",confirm:"CONFIRMER LE RETOUR",itemsToReturn:"articles à retourner",delivered:"Livré",size:"Taille",noOrders:"Aucune commande livrée.",selectReason:"Choisir raison",tooBig:"Trop grand",tooSmall:"Trop petit",style:"Style non aimé",desc:"Non conforme",damaged:"Endommagé",mind:"Changement d'avis"},
es:{title:"Devolver un artículo",sub:"Selecciona artículos de tus pedidos entregados. 28 días para devolución.",keep:"CONSERVAR",ret:"DEVOLVER",confirm:"CONFIRMAR DEVOLUCIÓN",itemsToReturn:"artículos para devolver",delivered:"Entregado",size:"Talla",noOrders:"No hay pedidos entregados.",selectReason:"Seleccionar motivo",tooBig:"Muy grande",tooSmall:"Muy pequeño",style:"No me gustó",desc:"No como descrito",damaged:"Dañado",mind:"Cambié de opinión"},
it:{title:"Restituisci un articolo",sub:"Seleziona articoli dagli ordini ricevuti. 28 giorni per reso.",keep:"TIENI",ret:"RESTITUISCI",confirm:"CONFERMA RESO",itemsToReturn:"articoli da restituire",delivered:"Consegnato",size:"Taglia",noOrders:"Nessun ordine consegnato.",selectReason:"Seleziona motivo",tooBig:"Troppo grande",tooSmall:"Troppo piccolo",style:"Stile non piaciuto",desc:"Non come descritto",damaged:"Danneggiato",mind:"Ho cambiato idea"},
nl:{title:"Artikel retourneren",sub:"Selecteer items uit geleverde bestellingen. 28 dagen retour.",keep:"HOUDEN",ret:"RETOURNEREN",confirm:"RETOUR BEVESTIGEN",itemsToReturn:"items om te retourneren",delivered:"Geleverd",size:"Maat",noOrders:"Geen geleverde bestellingen.",selectReason:"Reden selecteren",tooBig:"Te groot",tooSmall:"Te klein",style:"Stijl bevalt niet",desc:"Niet zoals beschreven",damaged:"Beschadigd",mind:"Van gedachten veranderd"},
el:{title:"Επιστροφή προϊόντος",sub:"Επιλέξτε είδη από παραδομένες παραγγελίες. 28 ημέρες.",keep:"ΚΡΑΤΗΣΗ",ret:"ΕΠΙΣΤΡΟΦΗ",confirm:"ΕΠΙΒΕΒΑΙΩΣΗ",itemsToReturn:"είδη για επιστροφή",delivered:"Παραδόθηκε",size:"Μέγεθος",noOrders:"Καμία παραδομένη παραγγελία.",selectReason:"Επιλογή λόγου",tooBig:"Πολύ μεγάλο",tooSmall:"Πολύ μικρό",style:"Δεν μου άρεσε",desc:"Όχι όπως περιγράφεται",damaged:"Κατεστραμμένο",mind:"Άλλαξα γνώμη"},
pl:{title:"Zwróć przedmiot",sub:"Wybierz przedmioty z dostarczonych zamówień. 28 dni na zwrot.",keep:"ZATRZYMAJ",ret:"ZWRÓĆ",confirm:"POTWIERDŹ ZWROT",itemsToReturn:"przedmiotów do zwrotu",delivered:"Dostarczono",size:"Rozmiar",noOrders:"Brak dostarczonych zamówień.",selectReason:"Wybierz powód",tooBig:"Za duże",tooSmall:"Za małe",style:"Nie podoba się styl",desc:"Nie jak opisano",damaged:"Uszkodzone",mind:"Zmieniłem zdanie"},
pt:{title:"Devolver um item",sub:"Selecione itens de pedidos entregues. 28 dias para devolução.",keep:"MANTER",ret:"DEVOLVER",confirm:"CONFIRMAR DEVOLUÇÃO",itemsToReturn:"itens para devolver",delivered:"Entregue",size:"Tamanho",noOrders:"Nenhum pedido entregue.",selectReason:"Selecione motivo",tooBig:"Muito grande",tooSmall:"Muito pequeno",style:"Não gostei",desc:"Não como descrito",damaged:"Danificado",mind:"Mudei de ideia"},
id:{title:"Kembalikan barang",sub:"Pilih item dari pesanan diterima. 28 hari retur.",keep:"SIMPAN",ret:"KEMBALIKAN",confirm:"KONFIRMASI RETUR",itemsToReturn:"item untuk dikembalikan",delivered:"Dikirim",size:"Ukuran",noOrders:"Tidak ada pesanan terkirim.",selectReason:"Pilih alasan",tooBig:"Terlalu besar",tooSmall:"Terlalu kecil",style:"Tidak suka gaya",desc:"Tidak sesuai deskripsi",damaged:"Rusak",mind:"Berubah pikiran"},
zh:{title:"退货",sub:"从已收到的订单中选择要退回的商品。28天退货期。",keep:"保留",ret:"退货",confirm:"确认退货",itemsToReturn:"件商品要退",delivered:"已送达",size:"尺码",noOrders:"没有已送达的订单。",selectReason:"选择原因",tooBig:"太大",tooSmall:"太小",style:"不喜欢款式",desc:"与描述不符",damaged:"损坏",mind:"改变主意"}
};

function getLang(){ return localStorage.getItem('lang')||'en'; }
function tr(key){ const lang=getLang(); return (translations[lang]||translations.en)[key]||key; }

function render(){
  const lang = getLang();
  // static texts
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n');
    if((translations[lang]||translations.en)[k]) el.textContent=(translations[lang]||translations.en)[k];
  });

  const orders = getOrders();
  const list = document.getElementById('ordersList');
  if(orders.length===0){
    list.innerHTML = `<div class="empty">${tr('noOrders')}</div>`;
    return;
  }
  list.innerHTML = orders.map(order=>`
    <div class="order-card">
      <div class="order-head"><span>Order ${order.id}</span><span>${order.date} • ${tr('delivered')}</span></div>
      ${order.items.map(item=>`
        <div class="item-row" id="row-${item.id}">
          <img class="item-img" src="${item.img}">
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-meta">${tr('size')}: ${item.size}</div>
            <div class="item-price">${item.price}</div>
            <div class="action-row">
              <button class="btn btn-keep ${toReturn[item.id]? '' : 'active'}" id="keep-${item.id}" onclick="keepItem('${item.id}')">${tr('keep')}</button>
              <button class="btn btn-return ${toReturn[item.id]? 'active' : ''}" id="ret-${item.id}" onclick="returnItem('${item.id}')">${tr('ret')}</button>
            </div>
            <div class="reason-box" id="reason-${item.id}" style="display:${toReturn[item.id]? 'block' : 'none'}">
              <select onchange="setReason('${item.id}', this.value)">
                <option value="">${tr('selectReason')}</option>
                <option ${toReturn[item.id]===tr('tooBig')?'selected':''}>${tr('tooBig')}</option>
                <option ${toReturn[item.id]===tr('tooSmall')?'selected':''}>${tr('tooSmall')}</option>
                <option>${tr('style')}</option>
                <option>${tr('desc')}</option>
                <option>${tr('damaged')}</option>
                <option>${tr('mind')}</option>
              </select>
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function keepItem(id){
  delete toReturn[id];
  document.getElementById(`ret-${id}`).classList.remove('active');
  document.getElementById(`keep-${id}`).classList.add('active');
  document.getElementById(`reason-${id}`).style.display='none';
  updateBar();
}
function returnItem(id){
  toReturn[id] = toReturn[id] || tr('mind');
  document.getElementById(`ret-${id}`).classList.add('active');
  document.getElementById(`keep-${id}`).classList.remove('active');
  document.getElementById(`reason-${id}`).style.display='block';
  updateBar();
}
function setReason(id, val){ toReturn[id]=val; }

function updateBar(){
  const n = Object.keys(toReturn).length;
  document.getElementById('count').textContent = n;
  document.getElementById('returnBar').style.display = n>0? 'flex' : 'none';
}

function submitReturn(){
  if(Object.keys(toReturn).length===0) return;
  const requests = JSON.parse(localStorage.getItem('return_requests')||'[]');
  requests.push({date:new Date().toISOString(), items:toReturn});
  localStorage.setItem('return_requests', JSON.stringify(requests));

  supabaseClient.auth.getUser().then(({data})=>{
    if(data.user){
      supabaseClient.from('returns').insert({user_id:data.user.id, items:toReturn}).then(()=>{});
    }
  });

  alert(`Return request for ${Object.keys(toReturn).length} ${tr('itemsToReturn')} submitted! You will receive a QR code by email.`);
  toReturn={};
  render();
  updateBar();
}

render();
</script>
</body>
</html>
