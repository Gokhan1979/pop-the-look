<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo.png">
<title>POP THE LOOK</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="overlay" id="overlay" onclick="toggleBurger(event)"></div>

<div class="pi-modal" id="piModal" onclick="if(event.target===this) closePI()">
<div class="pi-box">
<div class="pi-head"><h2>Personal Information</h2><button class="pi-close" onclick="closePI()">✕</button></div>
<div class="pi-form">
<div class="pi-row">
<div class="pi-field"><label>First Name</label><input id="firstName" placeholder="James"></div>
<div class="pi-field"><label>Last Name</label><input id="lastName" placeholder="Smith"></div>
</div>
<div class="pi-field"><label>Street Name</label><input id="street" placeholder="221B Baker Street"></div>
<div class="pi-row">
<div class="pi-field"><label>City</label><input id="city" placeholder="London"></div>
<div class="pi-field"><label>Country</label><input id="country" value="United Kingdom"></div>
</div>
<div class="pi-row">
<div class="pi-field"><label>Postcode</label><input id="postcode" placeholder="W1U 6TJ"></div>
<div class="pi-field"><label>Phone Number</label><input id="phone" type="tel" placeholder="+44 7123 456789"></div>
</div>
<div class="pi-field"><label>Email</label><input id="email" type="email" placeholder="james@email.co.uk"></div>
<button class="pi-save" onclick="savePI()">SAVE CHANGES</button>
</div>
</div>
</div>

<header style="position:relative;">
<div class="logo-top"><img src="logo.png" alt="POP THE LOOK"></div>
<div class="signout-row"><button id="signoutTop" class="signout-top" style="display:none;" onclick="handleSignout()">Sign Out</button></div>
<div class="nav-bar">
<div class="nav-left">
<button class="burger-btn" onclick="toggleBurger(event)"><span></span><span></span><span></span></button>
<select id="language" class="lang-select"><option value="en">EN</option><option value="tr">TR</option><option value="de">DE</option></select>
</div>
<div class="nav-right">
<button class="icon-btn" onclick="location.href='shop.html'"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
<div class="profile-wrap">
<button class="icon-btn" id="profileBtn" onclick="toggleProfile(event)">
<svg id="headIcon" class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 19c0-3.5 3.5-6 7-6s7 2.5 7 6"></path></svg>
<img id="headAvatar" class="avatar-img" style="display:none;" src="">
</button>
<span id="profileName" class="profile-name"></span>
<div class="dropdown" id="profileDropdown">
<div class="profile-photo-box">
<img id="dropdownAvatar" src="https://via.placeholder.com/100?text=Photo" alt="Profile">
<input type="file" id="photoInput" accept="image/*" onchange="uploadPhoto(event)">
<button class="upload-btn" onclick="document.getElementById('photoInput').click()">Upload Photo</button>
</div>
<a href="#" onclick="event.preventDefault(); openPI();">Personal Information</a>
<a id="signinLink" href="signin.html">Sign In</a>
<a id="signupLink" href="signup.html">Sign Up</a>
</div>
</div>
<button class="icon-btn" onclick="location.href='cart.html'"><svg class="icon" viewBox="0 0 24 24"><path d="M6 8h12l-1 11H7L6 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg></button>
</div>
</div>
<div class="burger-drawer" id="burgerDrawer">
<a href="shop.html">Shop</a><a href="#">New Arrivals</a><a href="#">Dresses</a><a href="#">Tops</a><a href="#">Accessories</a><a href="#">Sale</a><a href="#">About</a>
</div>
</header>
<div class="hero"><h1>NEW<br>DROP</h1><p>Curated looks. Tap to shop the full fit.</p><a class="shop-btn" href="shop.html">SHOP NOW</a></div>
<div class="grid"><div class="card">HOODIES</div><div class="card">CARGO</div><div class="card">TEES</div><div class="card">ACCESSORIES</div></div>

<script src="js/app.js"></script>
</body>
</html>
