<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo.png">
<title>POP THE LOOK</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="overlay" id="overlay" onclick="toggleBurger(event)"></div>

<div class="pi-modal" id="piModal" onclick="if(event.target===this) closePI()">
<div class="pi-box">
<div class="pi-head"><h2 data-i18n="pi">Personal Information</h2><button class="pi-close" onclick="closePI()">✕</button></div>
<div class="pi-form">
<div class="pi-row">
<div class="pi-field"><label data-i18n="firstName">First Name</label><input id="firstName" placeholder="James" autocomplete="off"></div>
<div class="pi-field"><label data-i18n="lastName">Last Name</label><input id="lastName" placeholder="Smith" autocomplete="off"></div>
</div>
<div class="pi-field"><label data-i18n="street">Street Name</label><input id="street" placeholder="221B Baker Street" autocomplete="off"></div>
<div class="pi-row">
<div class="pi-field"><label data-i18n="city">City</label><input id="city" placeholder="London" autocomplete="off"></div>
<div class="pi-field"><label data-i18n="country">Country</label>
<select id="country" onchange="autoPhoneCode()">
<option value="United Kingdom" selected>🇬🇧 United Kingdom</option><option value="Turkey">🇹🇷 Turkey</option><option value="Germany">🇩🇪 Germany</option><option value="France">🇫🇷 France</option><option value="Spain">🇪🇸 Spain</option><option value="Italy">🇮🇹 Italy</option><option value="Netherlands">🇳🇱 Netherlands</option><option value="Greece">🇬🇷 Greece</option><option value="Poland">🇵🇱 Poland</option><option value="Portugal">🇵🇹 Portugal</option><option value="Indonesia">🇮🇩 Indonesia</option><option value="China">🇨🇳 China</option><option value="United States">🇺🇸 United States</option><option value="Canada">🇨🇦 Canada</option><option value="Australia">🇦🇺 Australia</option><option value="Afghanistan">🇦🇫 Afghanistan</option><option value="Albania">🇦🇱 Albania</option><option value="Algeria">🇩🇿 Algeria</option><option value="Argentina">🇦🇷 Argentina</option><option value="Austria">🇦🇹 Austria</option><option value="Bangladesh">🇧🇩 Bangladesh</option><option value="Belgium">🇧🇪 Belgium</option><option value="Brazil">🇧🇷 Brazil</option><option value="Bulgaria">🇧🇬 Bulgaria</option><option value="Chile">🇨🇱 Chile</option><option value="Colombia">🇨🇴 Colombia</option><option value="Denmark">🇩🇰 Denmark</option><option value="Egypt">🇪🇬 Egypt</option><option value="Finland">🇫🇮 Finland</option><option value="India">🇮🇳 India</option><option value="Japan">🇯🇵 Japan</option><option value="Mexico">🇲🇽 Mexico</option><option value="Norway">🇳🇴 Norway</option><option value="Pakistan">🇵🇰 Pakistan</option><option value="Romania">🇷🇴 Romania</option><option value="Russia">🇷🇺 Russia</option><option value="Saudi Arabia">🇸🇦 Saudi Arabia</option><option value="Singapore">🇸🇬 Singapore</option><option value="South Africa">🇿🇦 South Africa</option><option value="Sweden">🇸🇪 Sweden</option><option value="Switzerland">🇨🇭 Switzerland</option><option value="Thailand">🇹🇭 Thailand</option><option value="Ukraine">🇺🇦 Ukraine</option><option value="UAE">🇦🇪 UAE</option>
</select>
</div>
</div>
<div class="pi-field"><label data-i18n="postcode">Postcode</label><input id="postcode" placeholder="W1U 6TJ" autocomplete="off"></div>
<div class="pi-field"><label data-i18n="phone">Phone Number</label>
<div class="phone-group">
<select id="phoneCode" class="phone-code">
<option value="+44" selected>🇬🇧 +44</option><option value="+90">🇹🇷 +90</option><option value="+49">🇩🇪 +49</option><option value="+33">🇫🇷 +33</option><option value="+34">🇪🇸 +34</option><option value="+39">🇮🇹 +39</option><option value="+31">🇳🇱 +31</option><option value="+30">🇬🇷 +30</option><option value="+48">🇵🇱 +48</option><option value="+351">🇵🇹 +351</option><option value="+62">🇮🇩 +62</option><option value="+86">🇨🇳 +86</option><option value="+1">🇺🇸 +1</option><option value="+61">🇦🇺 +61</option><option value="+91">🇮🇳 +91</option><option value="+81">🇯🇵 +81</option><option value="+971">🇦🇪 +971</option><option value="+27">🇿🇦 +27</option>
</select>
<input id="phone" class="phone-number" type="tel" placeholder="7123 456789" autocomplete="off">
</div>
</div>
<div class="pi-field"><label data-i18n="email">Email</label><input id="email" type="email" placeholder="james@email.co.uk" autocomplete="off" readonly></div>
<button class="pi-save" onclick="savePI()" data-i18n="save">SAVE CHANGES</button>
</div>
</div>
</div>

<header style="position:relative;">
<div class="logo-top"><img src="logo.png" alt="POP THE LOOK"></div>
<div class="nav-bar">
<div class="nav-left">
<button class="burger-btn" onclick="toggleBurger(event)"><span></span><span></span><span></span></button>
<div class="lang-wrap">
<select id="language" class="lang-select">
<option value="en">EN</option><option value="tr">TR</option><option value="de">DE</option><option value="fr">FR</option><option value="es">ES</option><option value="it">IT</option><option value="nl">NL</option><option value="el">GR</option><option value="pl">PL</option><option value="pt">PT</option><option value="id">ID</option><option value="zh">中文</option>
</select>
<div class="lang-arrows"><span>▲</span><span>▼</span></div>
</div>
</div>
<div class="nav-right">
<button class="icon-btn" onclick="location.href='shop.html'"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
<div class="profile-wrap">
<button class="icon-btn" id="profileBtn" onclick="toggleProfile(event)" style="padding:2px;">
<svg id="headIcon" class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 19c0-3.5 3.5-6 7-6s7 2.5 7 6"></path></svg>
<img id="headAvatar" class="avatar-img" style="display:none;" src="">
</button>
<span id="profileName" class="profile-name"></span>
<div class="dropdown" id="profileDropdown">
<div class="profile-photo-box">
<img id="dropdownAvatar" src="https://via.placeholder.com/100?text=Photo" alt="Profile">
<input type="file" id="photoInput" accept="image/*" onchange="uploadPhoto(event)">
<button class="upload-btn" onclick="document.getElementById('photoInput').click()" data-i18n="upload">Upload Photo</button>
</div>
<a href="#" onclick="event.preventDefault(); openPI();" data-i18n="pi">Personal Information</a>
<a href="order-history.html" data-i18n="orders">Order History</a>
<a href="login-security.html" data-i18n="loginSec">Login & Security</a>
<a id="signoutDropdown" href="#" onclick="event.preventDefault(); handleSignout();" data-i18n="signout" style="color:#ff0000!important;">Sign Out</a>
<a id="signinLink" href="signin.html" data-i18n="signin" style="display:none;">Sign In</a>
<a id="signupLink" href="signup.html" data-i18n="signup" style="display:none;">Sign Up</a>
</div>
</div>
<button class="icon-btn" onclick="location.href='cart.html'"><svg class="icon" viewBox="0 0 24 24"><path d="M6 8h12l-1 11H7L6 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg></button>
</div>
</div>
<div class="burger-drawer" id="burgerDrawer">
<a href="shop.html" data-i18n="shop">Shop</a><a href="#" data-i18n="new">New Arrivals</a><a href="#" data-i18n="dresses">Dresses</a><a href="#" data-i18n="tops">Tops</a><a href="#" data-i18n="accessories">Accessories</a><a href="#" data-i18n="sale">Sale</a><a href="#" data-i18n="about">About</a>
</div>
</header>

<div class="hero"><h1 data-i18n="heroTitle">NEW<br>DROP</h1><p data-i18n="heroDesc">Curated looks. Tap to shop the full fit.</p><a class="shop-btn" href="shop.html" data-i18n="shopBtn">SHOP NOW</a></div>
<div class="grid"><div class="card" data-i18n="hoodies">HOODIES</div><div class="card" data-i18n="cargo">CARGO</div><div class="card" data-i18n="tees">TEES</div><div class="card" data-i18n="accessories">ACCESSORIES</div></div>

<script src="js/supabase.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>

</body>
</html>
