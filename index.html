<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POP THE LOOK</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
  body { background:white; }
  header { display:flex; justify-content:space-between; align-items:center; padding:15px 20px; border-bottom:1px solid #eee; position:sticky; top:0; background:white; z-index:10; }
  .logo { font-weight:900; letter-spacing:2px; font-size:18px; }
  .right { display:flex; gap:10px; }
  .btn { padding:8px 16px; border-radius:20px; font-size:13px; font-weight:bold; text-decoration:none; }
  .btn-outline { border:1px solid black; color:black; background:white; }
  .btn-black { background:black; color:white; border:1px solid black; }
  .hero { padding:60px 20px; text-align:center; }
  .hero h1 { font-size:42px; font-weight:900; line-height:0.9; }
  .hero p { color:#777; margin:15px 0 25px; font-size:14px; }
  .shop-btn { background:black; color:white; padding:14px 28px; border-radius:25px; text-decoration:none; font-weight:bold; display:inline-block; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px; }
  .card { background:#f5f5f5; border-radius:12px; height:220px; display:flex; align-items:flex-end; padding:12px; font-weight:bold; font-size:13px; }
</style>
</head>
<body>
<header>
  <div class="logo">POP THE LOOK</div>
  <div class="right">
    <a class="btn btn-outline" href="signin.html">Sign In</a>
    <a class="btn btn-black" href="signup.html">Sign Up</a>
  </div>
</header>

<div class="hero">
  <h1>NEW<br>DROP</h1>
  <p>Curated looks. Tap to shop the full fit.</p>
  <a class="shop-btn" href="shop.html">SHOP NOW</a>
</div>

<div class="grid">
  <div class="card">HOODIES</div>
  <div class="card">CARGO</div>
  <div class="card">TEES</div>
  <div class="card">ACCESSORIES</div>
</div>
</body>
</html>
