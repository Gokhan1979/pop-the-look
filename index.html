<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo.png">
<title>POP THE LOOK</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:white;overflow-x:hidden}
header{display:flex;flex-direction:column;align-items:center;background:white;position:sticky;top:0;z-index:50;width:100%}
.logo-top{display:flex;justify-content:center;width:100%;padding:22px 10px 18px;background:white}
.logo-top img{height:110px;width:auto;max-width:92vw;object-fit:contain;display:block}
.signout-row{position:absolute;right:18px;top:105px;z-index:60}
.signout-top{background:black;color:white;border:none;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer}
.nav-bar{display:flex;align-items:center;justify-content:space-between;width:100%;padding:5px 18px;border-top:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5;background:white;gap:10px;margin-top:-16px;position:relative}
.nav-left{display:flex;align-items:center;gap:12px;flex:1}
.burger-btn{background:none;border:none;cursor:pointer;padding:6px;display:flex;flex-direction:column;gap:4px;z-index:1001}
.burger-btn span{width:20px;height:2.5px;background:black;display:block;border-radius:2px}
.burger-drawer{position:fixed;left:0;top:154px;width:260px;background:white;border-right:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5;box-shadow:4px 8px 20px rgba(0,0,0,0.15);padding:12px 0;display:none;flex-direction:column;z-index:1001}
.burger-drawer.show{display:flex}
.burger-drawer a{text-decoration:none;color:black;font-size:14px;font-weight:600;padding:14px 18px;border-bottom:1px solid #f2f2f2}
.nav-right{display:flex;gap:16px;align-items:center;flex-shrink:0;margin-left:10px}
.lang-select{padding:6px 14px;border-radius:999px;border:1.5px solid #ddd;font-size:13px;font-weight:700;background:white;cursor:pointer}
.icon-btn{background:none;border:none;cursor:pointer;padding:6px;display:flex;align-items:center}
.icon{width:22px;height:22px;stroke-width:1.8;stroke:black;fill:none}
.profile-wrap{position:relative;display:flex;align-items:center;gap:6px}
.profile-name{font-size:13px;font-weight:800;display:none;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar-img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1.5px solid #ddd}
.dropdown{position:absolute;right:0;top:42px;background:white;border:1.5px solid #ddd;border-radius:18px;box-shadow:0 14px 35px rgba(0,0,0,0.20);padding:14px;min-width:280px;display:none;z-index:9999}
.dropdown.show{display:block!important}
.dropdown a{display:block;width:100%;text-align:left;padding:16px 16px;border-radius:12px;background:white;text-decoration:none;color:black;font-size:15px;font-weight:700;margin-bottom:4px}
.profile-photo-box{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0 16px;border-bottom:1px solid #f0f0f0;margin-bottom:10px}
.profile-photo-box img{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#f5f5f5;border:2px solid #eee}
.profile-photo-box input{display:none}
.upload-btn{background:black;color:white;border:none;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer}
.pi-modal{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px;overflow-y:auto}
.pi-modal.show{display:flex}
.pi-box{background:white;width:100%;max-width:480px;border-radius:24px;padding:28px 22px;box-shadow:0 25px 70px rgba(0,0,0,0.35);margin:auto}
.pi-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.pi-head h2{font-size:20px;font-weight:900}
.pi-close{background:#f1f1f1;border:none;width:34px;height:34px;border-radius:50%;cursor:pointer;font-weight:800}
.pi-form{display:flex;flex-direction:column;gap:14px}
.pi-row{display:flex;gap:12px}
.pi-field{flex:1;display:flex;flex-direction:column;gap:6px}
.pi-field label{font-size:10px;font-weight:800;color:#888;text-transform:uppercase;letter-spacing:0.6px}
.pi-field input{padding:14px 14px;border:1.8px solid #e5e5e5;border-radius:13px;font-size:14px;outline:none}
.pi-field input:focus{border-color:black;background:#fafafa}
.pi-save{margin-top:8px;background:black;color:white;border:none;padding:15px;border-radius:14px;font-weight:900;font-size:14px;cursor:pointer}
.hero{padding:50px 20px;text-align:center}.hero h1{font-size:42px;font-weight:900;line-height:.9}.hero p{color:#777;margin:15px 0 25px;font-size:14px}.shop-btn{background:black;color:white;padding:14px 28px;border-radius:25px;text-decoration:none;font-weight:bold;display:inline-block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#f5f5f5;border-radius:12px;height:200px;display:flex;align-items:flex-end;padding:12px;font-weight:bold;font-size:13px}
.overlay{position:fixed;inset:0;background:transparent;display:none;z-index:1000}.overlay.show{display:block}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="toggleBurger(event)"></div>

<div class="pi-modal" id="piModal" onclick="if(event.target===this) closePI()">
<div class="pi-box">
<div class="pi-head"><h2>Personal Information</h2><button class="pi-close" onclick="closePI()">✕</button></div>
<div class="pi-form">
<div class="pi-row">
<div class="pi-field"><label>First Name</label><input id="firstName" placeholder="James"></div>
<div class="pi-field"><label>Last Name</label><input id="lastName" placeholder="Smith"></div>
</div>
<div class="pi-field"><label>Street Name</label><input id="street" placeholder="221B Baker Street"></div>
<div class="pi-row">
<div class="pi-field"><label>City</label><input id="city" placeholder="London"></div>
<div class="pi-field"><label>Country</label><input id="country" value="United Kingdom"></div>
</div>
<div class="pi-row">
<div class="pi-field"><label>Postcode</label><input id="postcode" placeholder="W1U 6TJ"></div>
<div class="pi-field"><label>Phone Number</label><input id="phone" type="tel" placeholder="+44 7123 456789"></div>
</div>
<div class="pi-field"><label>Email</label><input id="email" type="email" placeholder="james@email.co.uk"></div>
<button class="pi-save" onclick="savePI()">SAVE CHANGES</button>
</div>
</div>
</div>

<header style="position:relative;">
<div class="logo-top"><img src="logo.png" alt="POP THE LOOK"></div>
<div class="signout-row"><button id="signoutTop" class="signout-top" style="display:none;" onclick="handleSignout()">Sign Out</button></div>
<div class="nav-bar">
<div class="nav-left">
<button class="burger-btn" onclick="toggleBurger(event)"><span></span><span></span><span></span></button>
<select id="language" class="lang-select"><option value="en">EN</option><option value="tr">TR</option><option value="de">DE</option></select>
</div>
<div class="nav-right">
<button class="icon-btn" onclick="location.href='shop.html'"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
<div class="profile-wrap">
<button class="icon-btn" id="profileBtn" onclick="toggleProfile(event)">
<svg id="headIcon" class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 19c0-3.5 3.5-6 7-6s7 2.5 7 6"></path></svg>
<img id="headAvatar" class="avatar-img" style="display:none;" src="">
</button>
<span id="profileName" class="profile-name"></span>
<div class="dropdown" id="profileDropdown">
<div class="profile-photo-box">
<img id="dropdownAvatar" src="https://via.placeholder.com/100?text=Photo" alt="Profile">
<input type="file" id="photoInput" accept="image/*" onchange="uploadPhoto(event)">
<button class="upload-btn" onclick="document.getElementById('photoInput').click()">Upload Photo</button>
</div>
<a href="#" onclick="event.preventDefault(); openPI();">Personal Information</a>
<a id="signinLink" href="signin.html">Sign In</a>
<a id="signupLink" href="signup.html">Sign Up</a>
</div>
</div>
<button class="icon-btn" onclick="location.href='cart.html'"><svg class="icon" viewBox="0 0 24 24"><path d="M6 8h12l-1 11H7L6 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg></button>
</div>
</div>
<div class="burger-drawer" id="burgerDrawer">
<a href="shop.html">Shop</a><a href="#">New Arrivals</a><a href="#">Dresses</a><a href="#">Tops</a><a href="#">Accessories</a><a href="#">Sale</a><a href="#">About</a>
</div>
</header>
<div class="hero"><h1>NEW<br>DROP</h1><p>Curated looks. Tap to shop the full fit.</p><a class="shop-btn" href="shop.html">SHOP NOW</a></div>
<div class="grid"><div class="card">HOODIES</div><div class="card">CARGO</div><div class="card">TEES</div><div class="card">ACCESSORIES</div></div>

<script>
function toggleBurger(e){ if(e) e.stopPropagation(); document.getElementById('burgerDrawer').classList.toggle('show'); document.getElementById('overlay').classList.toggle('show'); }
function toggleProfile(e){ if(e) e.stopPropagation(); document.getElementById('profileDropdown').classList.toggle('show'); }

async function openPI(){
  document.getElementById('profileDropdown').classList.remove('show');
  const s=JSON.parse(localStorage.getItem('personalInfo')||'{}');
  let supaFirst='', supaLast='', supaEmail='';
  try{
    const {data:{session}} = await supabaseClient.auth.getSession();
    if(session && session.user){
      supaEmail = session.user.email || '';
      const meta = session.user.user_metadata || {};
      supaFirst = meta.first_name || meta.firstName || '';
      supaLast = meta.last_name || meta.lastName || '';
      if(!supaFirst && meta.full_name){ const p=meta.full_name.trim().split(' '); supaFirst=p[0]||''; supaLast=p.slice(1).join(' ')||''; }
    }
  }catch(err){}
  document.getElementById('firstName').value = s.firstName || supaFirst || '';
  document.getElementById('lastName').value = s.lastName || supaLast || '';
  document.getElementById('street').value = s.street || '';
  document.getElementById('city').value = s.city || '';
  document.getElementById('country').value = s.country || 'United Kingdom';
  document.getElementById('postcode').value = s.postcode || '';
  document.getElementById('email').value = s.email || supaEmail || '';
  document.getElementById('phone').value = s.phone || '';
  document.getElementById('piModal').classList.add('show');
}
function closePI(){ document.getElementById('piModal').classList.remove('show'); }
async function savePI(){
  const data={firstName:document.getElementById('firstName').value,lastName:document.getElementById('lastName').value,street:document.getElementById('street').value,city:document.getElementById('city').value,country:document.getElementById('country').value,postcode:document.getElementById('postcode').value,email:document.getElementById('email').value,phone:document.getElementById('phone').value};
  const old = JSON.parse(localStorage.getItem('personalInfo')||'{}');
  if(old.profilePhoto) data.profilePhoto = old.profilePhoto;
  localStorage.setItem('personalInfo',JSON.stringify(data));
  try{ await supabaseClient.auth.updateUser({ data:{ first_name:data.firstName, last_name:data.lastName, full_name:data.firstName+' '+data.lastName } }); }catch(e){}
  updateHeaderUI();
  alert('Saved! UK Address updated');
  closePI();
}
function uploadPhoto(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const base64 = ev.target.result;
    const s = JSON.parse(localStorage.getItem('personalInfo')||'{}');
    s.profilePhoto = base64;
    localStorage.setItem('personalInfo', JSON.stringify(s));
    updateHeaderUI();
  };
  reader.readAsDataURL(file);
}
function updateHeaderUI(){
  const s = JSON.parse(localStorage.getItem('personalInfo')||'{}');
  const nameEl = document.getElementById('profileName');
  const headIcon = document.getElementById('headIcon');
  const headAvatar = document.getElementById('headAvatar');
  const dropAvatar = document.getElementById('dropdownAvatar');
  if(s.profilePhoto){
    dropAvatar.src = s.profilePhoto;
    headAvatar.src = s.profilePhoto;
    headAvatar.style.display='block';
    headIcon.style.display='none';
  } else {
    headAvatar.style.display='none';
    headIcon.style.display='block';
  }
  if(s.firstName){
    nameEl.textContent = s.firstName;
    nameEl.style.display='block';
  } else {
    // try supabase name if no local firstName yet
    supabaseClient.auth.getSession().then(({data})=>{
      const meta = data.session?.user?.user_metadata || {};
      const fn = s.firstName || meta.first_name || meta.full_name?.split(' ')[0] || '';
      if(fn){ nameEl.textContent=fn; nameEl.style.display='block'; }
    });
  }
}
document.addEventListener('click',function(e){ if(!e.target.closest('#burgerDrawer') &&!e.target.closest('.burger-btn')){ document.getElementById('burgerDrawer').classList.remove('show'); document.getElementById('overlay').classList.remove('show'); } if(!e.target.closest('.profile-wrap')){ document.getElementById('profileDropdown').classList.remove('show'); } });
const supabaseClient=supabase.createClient("https://pslsuittihsaeeyrihgr.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzbHN1aXR0aWhzYWVleXJpaGdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NDE4MjYsImV4cCI6MjEwNTQxNzgyNn0.dZEAEHzbOgaPHzQWWzk1whjPFmmME8G2kuvAc4b72mI");
async function checkUser(){ const{data}=await supabaseClient.auth.getSession(); const isLoggedIn=!!data.session; document.getElementById('signinLink').style.display=isLoggedIn?'none':'block'; document.getElementById('signupLink').style.display=isLoggedIn?'none':'block'; document.getElementById('signoutTop').style.display=isLoggedIn?'block':'none'; if(isLoggedIn){ document.getElementById('profileName').style.display='block'; } updateHeaderUI(); }
async function handleSignout(){await supabaseClient.auth.signOut(); localStorage.removeItem('personalInfo'); location.href='signin.html'} checkUser();
</script>
</body>
</html>
