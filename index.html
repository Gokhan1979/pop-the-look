<style>

  body { background:white; overflow-x:hidden; }
  header { display:flex; flex-direction:column; align-items:center; background:white; position:sticky; top:0; z-index:50; width:100%; }
.logo-top { display:flex; justify-content:center; width:100%; padding:22px 10px 18px; background:white; }
.logo-top img { height:110px; width:auto; max-width:92vw; object-fit:contain; display:block; }
.nav-bar { display:flex; align-items:center; justify-content:space-between; width:100%; padding:5px 18px; border-top:1px solid #e5e5e5; border-bottom:1px solid #e5e5e5; background:white; gap:10px; flex-wrap:nowrap; overflow:hidden; margin-top:-16px; }
.nav-left { display:flex; align-items:center; gap:18px; flex:1; flex-wrap:nowrap; min-width:0; }
.nav-menu { display:flex; align-items:center; gap:16px; flex-wrap:nowrap; white-space:nowrap; overflow-x:auto; scrollbar-width:none; }
.nav-menu::-webkit-scrollbar{ display:none; }
.nav-menu a { text-decoration:none; color:black; font-size:13px; font-weight:600; white-space:nowrap; }
.nav-right { display:flex; gap:16px; align-items:center; flex-shrink:0; margin-left:10px; position:relative; }
.lang-select { padding:6px 14px; border-radius:999px; border:1.5px solid #ddd; font-size:13px; font-weight:700; background:white; cursor:pointer; flex-shrink:0; }
.icon-btn { background:none; border:none; cursor:pointer; padding:4px; display:flex; align-items:center; }
.icon { width:20px; height:20px; stroke-width:1.8; stroke:black; fill:none; }
.profile-wrap { position:relative; }
.dropdown { position:absolute; right:0; top:32px; background:white; border:1px solid #eee; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.1); padding:8px; min-width:160px; display:none; z-index:100; }
.dropdown.show { display:block; }
.dropdown a,.dropdown button { display:block; width:100%; text-align:left; padding:10px 12px; border-radius:8px; border:none; background:white; text-decoration:none; color:black; font-size:13px; font-weight:600; cursor:pointer; }
.dropdown a:hover,.dropdown button:hover { background:#f5f5f5; }
.btn { padding:7px 14px; border-radius:20px; font-size:12px; font-weight:bold; text-decoration:none; cursor:pointer; white-space:nowrap; }
.btn-outline { border:1px solid black; color:black; background:white; }
.btn-black { background:black; color:white; border:1px solid black; }
.hero { padding:50px 20px; text-align:center; }
.hero h1 { font-size:42px; font-weight:900; line-height:0.9; }
.hero p { color:#777; margin:15px 0 25px; font-size:14px; }
.shop-btn { background:black; color:white; padding:14px 28px; border-radius:25px; text-decoration:none; font-weight:bold; display:inline-block; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px; }
.card { background:#f5f5f5; border-radius:12px; height:200px; display:flex; align-items:flex-end; padding:12px; font-weight:bold; font-size:13px; }
</style>
</head>

        </div>
      </div>
      <button class="icon-btn" onclick="location.href='cart.html'" aria-label="Cart">

function changeLang(){
  const lang = document.getElementById('language').value;
  localStorage.setItem('siteLang', lang);
  document.getElementById('heroTitle').innerHTML = translations[lang].heroTitle;
  document.getElementById('heroText').innerText = translations[lang].heroText;
  document.getElementById('shopBtn').innerText = translations[lang].shopBtn;
  document.getElementById('cat1').innerText = translations[lang].cat1;
  document.getElementById('cat2').innerText = translations[lang].cat2;
  document.getElementById('cat3').innerText = translations[lang].cat3;
  document.getElementById('cat4').innerText = translations[lang].cat4;
  document.getElementById('signinLink').innerText = translations[lang].signin;
  document.getElementById('signupLink').innerText = translations[lang].signup;
  document.getElementById('signoutLink').innerText = translations[lang].signout;
  document.documentElement.lang = lang;
}

  document.getElementById('profileDropdown').classList.toggle('show');
}

  if(!e.target.closest('.profile-wrap')){

});
