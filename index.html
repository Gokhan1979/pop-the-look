<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:white;overflow-x:hidden}
header{display:flex;flex-direction:column;align-items:center;background:white;position:sticky;top:0;z-index:50;width:100%}
.logo-top{display:flex;justify-content:center;width:100%;padding:22px 10px 18px;background:white}
.logo-top img{height:110px;width:auto;max-width:92vw;object-fit:contain;display:block}
.signout-row{position:absolute;right:18px;top:105px;z-index:60}
.signout-top{background:black;color:white;border:none;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer}
.nav-bar{display:flex;align-items:center;justify-content:space-between;width:100%;padding:5px 18px;border-top:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5;background:white;gap:10px;flex-wrap:nowrap;margin-top:-16px;position:relative;overflow:visible}
.nav-left{display:flex;align-items:center;gap:12px;flex:1;flex-wrap:nowrap;min-width:0}
.burger-btn{background:none;border:none;cursor:pointer;padding:6px;display:flex;flex-direction:column;gap:4px;z-index:1001}
.burger-btn span{width:20px;height:2.5px;background:black;display:block;border-radius:2px}
.burger-drawer{position:fixed;left:0;top:154px;width:260px;background:white;border-right:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5;box-shadow:4px 8px 20px rgba(0,0,0,0.15);padding:12px 0;display:none;flex-direction:column;z-index:1001}
.burger-drawer.show{display:flex}
.burger-drawer a{text-decoration:none;color:black;font-size:14px;font-weight:600;padding:14px 18px;border-bottom:1px solid #f2f2f2}
.burger-drawer a:last-child{border-bottom:none}
.burger-drawer a:hover{background:#f5f5f5}
.nav-right{display:flex;gap:16px;align-items:center;flex-shrink:0;margin-left:10px}
.lang-select{padding:6px 14px;border-radius:999px;border:1.5px solid #ddd;font-size:13px;font-weight:700;background:white;cursor:pointer;flex-shrink:0}
.icon-btn{background:none;border:none;cursor:pointer;padding:6px;display:flex;align-items:center}
.icon{width:22px;height:22px;stroke-width:1.8;stroke:black;fill:none}
.profile-wrap{position:relative}
/* BIG DROPDOWN - FIXED TINY ISSUE */
.dropdown{position:absolute;right:0;top:42px;background:white;border:1.5px solid #ddd;border-radius:18px;box-shadow:0 14px 35px rgba(0,0,0,0.20);padding:14px;min-width:250px;display:none;z-index:9999}
.dropdown.show{display:block!important}
.dropdown a,.dropdown button{display:block;width:100%;text-align:left;padding:16px 16px;border-radius:12px;border:none;background:white;text-decoration:none;color:black;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:4px}
.dropdown a:hover,.dropdown button:hover{background:#f2f2f2}
/* PERSONAL INFO MODAL - STYLISH BIG */
.pi-modal{position:fixed;inset:0;background:rgba(0,0,0,0.50);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
.pi-modal.show{display:flex}
.pi-box{background:white;width:100%;max-width:460px;border-radius:24px;padding:28px 22px;box-shadow:0 25px 70px rgba(0,0,0,0.30)}
.pi-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.pi-head h2{font-size:20px;font-weight:900;letter-spacing:-0.5px}
.pi-close{background:#f1f1f1;border:none;width:34px;height:34px;border-radius:50%;cursor:pointer;font-weight:800;font-size:16px}
.pi-form{display:flex;flex-direction:column;gap:14px}
.pi-row{display:flex;gap:12px}
.pi-field{flex:1;display:flex;flex-direction:column;gap:6px}
.pi-field label{font-size:11px;font-weight:800;letter-spacing:0.7px;color:#888;text-transform:uppercase}
.pi-field input{padding:14px 14px;border:1.8px solid #e5e5e5;border-radius:13px;font-size:14px;font-weight:500;outline:none}
.pi-field input:focus{border-color:black;background:#fafafa}
.pi-save{margin-top:8px;background:black;color:white;border:none;padding:15px;border-radius:14px;font-weight:900;font-size:14px;cursor:pointer;letter-spacing:0.3px}
.hero{padding:50px 20px;text-align:center}.hero h1{font-size:42px;font-weight:900;line-height:.9}.hero p{color:#777;margin:15px 0 25px;font-size:14px}.shop-btn{background:black;color:white;padding:14px 28px;border-radius:25px;text-decoration:none;font-weight:bold;display:inline-block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#f5f5f5;border-radius:12px;height:200px;display:flex;align-items:flex-end;padding:12px;font-weight:bold;font-size:13px}
.overlay{position:fixed;inset:0;background:transparent;display:none;z-index:1000}
.overlay.show{display:block}
</style>
</head>

function changeLang(){
const lang=document.getElementById('language').value;
localStorage.setItem('siteLang',lang);
const t=translations[lang];
document.getElementById('heroTitle').innerHTML=t.heroTitle;
document.getElementById('heroText').innerText=t.heroText;
document.getElementById('shopBtn').innerText=t.shopBtn;
document.getElementById('cat1').innerText=t.cat1;

document.getElementById('cat4').innerText=t.cat4;

document.getElementById('signupLink').innerText=t.signup;
document.getElementById('signoutTop').innerText=t.signout;
document.getElementById('navShop').innerText=t.navShop;
document.getElementById('navNew').innerText=t.navNew;
document.getElementById('navDresses').innerText=t.navDresses;
document.getElementById('navTops').innerText=t.navTops;
document.getElementById('navAcc').innerText=t.navAcc;
document.getElementById('navSale').innerText=t.navSale;
