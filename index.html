*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:white;overflow-x:hidden}
header{display:flex;flex-direction:column;align-items:center;background:white;position:sticky;top:0;z-index:50;width:100%}
.logo-top{display:flex;justify-content:center;width:100%;padding:22px 10px 18px;background:white}
.logo-top img{height:110px;width:auto;max-width:92vw;object-fit:contain;display:block}
.signout-row{position:absolute;right:18px;top:105px;z-index:60}
.signout-top{background:black;color:white;border:none;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer}
.nav-bar{display:flex;align-items:center;justify-content:space-between;width:100%;padding:5px 18px;border-top:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5;background:white;gap:10px;flex-wrap:nowrap;margin-top:-16px;position:relative;overflow:visible}
.nav-left{display:flex;align-items:center;gap:12px;flex:1;flex-wrap:nowrap;min-width:0}
.burger-btn{background:none;border:none;cursor:pointer;padding:6px;display:flex;flex-direction:column;gap:4px;z-index:1001}
.burger-btn span{width:20px;height:2.5px;background:black;display:block;border-radius:2px}
.burger-drawer{position:fixed;left:0;top:154px;width:260px;background:white;border-right:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5;box-shadow:4px 8px 20px rgba(0,0,0,0.15);padding:12px 0;display:none;flex-direction:column;z-index:1001}
.burger-drawer.show{display:flex}
.burger-drawer a{text-decoration:none;color:black;font-size:14px;font-weight:600;padding:14px 18px;border-bottom:1px solid #f2f2f2}
.burger-drawer a:last-child{border-bottom:none}
.burger-drawer a:hover{background:#f5f5f5}
.nav-right{display:flex;gap:16px;align-items:center;flex-shrink:0;margin-left:10px}
.lang-select{padding:6px 14px;border-radius:999px;border:1.5px solid #ddd;font-size:13px;font-weight:700;background:white;cursor:pointer;flex-shrink:0}
.icon-btn{background:none;border:none;cursor:pointer;padding:6px;display:flex;align-items:center}
.icon{width:22px;height:22px;stroke-width:1.8;stroke:black;fill:none}
.profile-wrap{position:relative}
.dropdown{position:absolute;right:0;top:38px;background:white;border:1px solid #ddd;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,0.15);padding:8px;min-width:170px;display:none;z-index:9999}
.dropdown.show{display:block!important}
.dropdown a,.dropdown button{display:block;width:100%;text-align:left;padding:12px 12px;border-radius:8px;border:none;background:white;text-decoration:none;color:black;font-size:13px;font-weight:600;cursor:pointer}

.overlay.show{display:block}

document.addEventListener('click',function(e){

  const ov=document.getElementById('overlay');

  if(dd) dd.classList.remove('show');
}
});
